    <meta charset="utf-8">

<body>

    <div id="header"></div>

    <main id="main" class="selected-project-page" data-selected-project-slug="135-kent">
        <div class="sp-shell">

            <section class="sp-hero" data-js-reveal>
                <div class="sp-hero-inner">
                    <div class="sp-copy">
                        <span class="sp-kicker" data-project-eyebrow>Selected Projects</span>
                        <h1 class="sp-title" data-project-name>Selected Project</h1>
                        <p class="sp-intro" data-project-description></p>

                        <div class="sp-meta-grid">
                            <article class="sp-meta-card">
                                <span class="sp-meta-label">Location</span>
                                <p data-project-location>Location</p>
                            </article>

                            <article class="sp-meta-card">
                                <span class="sp-meta-label">Client</span>
                                <p data-project-client>Client</p>
                            </article>
                        </div>
                    </div>

                    <aside class="sp-map-card">
                        <div class="sp-map-header">
                            <div>
                                <span class="sp-map-heading">Map</span>
                                <p class="sp-map-address" data-project-address>Project address</p>
                            </div>
                        </div>

                        <div class="sp-map-shell">
                            <div id="selected-project-map" class="sp-map"></div>
                            <div class="sp-map-empty hidden" data-map-empty>
                                <div>
                                    <span>Coordinates Pending</span>
                                    <p>Add latitude and longitude in the project data module to activate the map pin.</p>
                                </div>
                            </div>
                        </div>
                    </aside>
                </div>
            </section>

            <section class="sp-gallery-section">
                <div class="sp-section-head">
                    <span class="sp-kicker">Gallery</span>
                    <div>
                        <h2 class="sp-section-title">Shots</h2>
                        <p class="sp-section-copy" data-gallery-summary></p>
                    </div>
                </div>

                <div id="selected-project-gallery" class="sp-gallery" aria-live="polite"></div>

                <div class="sp-back-nav">
                    <a href="/work/stills/" class="sp-back-link" aria-label="Back to Stills">
                        <span class="sp-back-link-main">
                            <span class="sp-back-link-arrow" aria-hidden="true">←</span>
                            <span class="sp-back-link-label">back to Stills</span>
                        </span>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script type="module" src="/js/engines/selected-project-page.js"></script>
    <script defer src="/js/boot-ready.js"></script>

</html>
