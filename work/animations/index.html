    <div id="header" data-lang-en="/work/animations/" data-lang-es="/es/proyectos/animaciones/"></div>

    <main id="main">

        <!-- SECTION 1: HEADER -->
        <section class="animations-header" data-js-reveal>
            <h1 class="animations-title">animations</h1>
            <div class="animations-subtitle">
                <h2>Emotion in Motion</h2>
                <p>Cinematic 3D animations built for digital displays, presentations, and video marketing.</p>
            </div>
        </section>

        <!-- SECTION 2: CINEMA SHOWCASE -->
        <section class="animations-cinema-section">

            <!-- THUMBNAILS STRIP -->
            <div class="cinema-thumbnails-wrapper">
                <div class="cinema-swipe-hint" aria-hidden="true">
                    <div class="cinema-swipe-line cinema-swipe-line-left"></div>
                    <span class="cinema-swipe-text">Swipe to select video</span>
                    <div class="cinema-swipe-line cinema-swipe-line-right"></div>
                </div>
                <div class="cinema-thumbnails" id="cinemaThumbnails">

                    <button class="cinema-thumb" data-title="Acantto Urban Living" data-index="0">
                        <div class="thumb-media">
                            <div class="thumb-img"></div>
                        </div>
                        <span class="thumb-title">Acantto Urban Living</span>
                    </button>

                    <button class="cinema-thumb" data-title="Cima Del Pedregal" data-index="1">
                        <div class="thumb-media">
                            <div class="thumb-img"></div>
                        </div>
                        <span class="thumb-title">Cima Del Pedregal</span>
                    </button>

                    <button class="cinema-thumb" data-title="Central Park Residential" data-index="2">
                        <div class="thumb-media">
                            <div class="thumb-img"></div>
                        </div>
                        <span class="thumb-title">Central Park Residential</span>
                    </button>

                    <button class="cinema-thumb active" data-title="Navy Yard Hotel, New York City" data-index="3">
                        <div class="thumb-media">
                            <div class="thumb-img"></div>
                        </div>
                        <span class="thumb-title">Navy Yard Hotel</span>
                    </button>

                    <button class="cinema-thumb" data-title="Vista Lago Residencial" data-index="4">
                        <div class="thumb-media">
                            <div class="thumb-img"></div>
                        </div>
                        <span class="thumb-title">Vista Lago Residencial</span>
                    </button>

                    <button class="cinema-thumb" data-title="New University Campus" data-index="5">
                        <div class="thumb-media">
                            <div class="thumb-img"></div>
                        </div>
                        <span class="thumb-title">New University Campus</span>
                    </button>

                    <button class="cinema-thumb" data-title="Pedregal del Encino" data-index="6">
                        <div class="thumb-media">
                            <div class="thumb-img"></div>
                        </div>
                        <span class="thumb-title">Pedregal del Encino</span>
                    </button>

                    <button class="cinema-thumb" data-title="Stanley Kubrick - The Shining Tribute" data-index="7">
                        <div class="thumb-media">
                            <div class="thumb-img"></div>
                        </div>
                        <span class="thumb-title">Stanley Kubrick</span>
                    </button>

                </div>
            </div>

            <!-- MAIN PLAYER STAGE -->
            <div class="cinema-main-stage">
                <div class="cinema-player" id="mainPlayer">
                    <iframe
                        class="cinema-embed"
                        id="cinemaEmbed"
                        title="Animation player"
                        width="1600"
                        height="900"
                        loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                        allowfullscreen></iframe>

                    <div class="cinema-poster" id="cinemaPoster"></div>
                    
                    <!-- Play interaction center -->
                    <button class="cinema-play-button" id="cinemaPlayButton" aria-label="Play Animation" type="button">
                        <div class="play-triangle"></div>
                    </button>

                    <!-- Overlay metadata and controls -->
                    <div class="cinema-overlay">
                        <div class="cinema-info">
                            <span class="cinema-label">Animation</span>
                            <h2 class="cinema-title-display" id="cinemaTitle">Navy Yard Hotel, New York City</h2>
                        </div>
                    </div>
                </div>
            </div>

        </section>
