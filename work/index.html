<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Primary SEO -->
    <title>Work | Arqing</title>
    <meta name="description"
        content="Explore Arqing's architectural visualization portfolio across stills, animations, and immersive 360° experiences for premium real estate and design presentations.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.arqingrenders.com/work/">
    <link rel="alternate" hreflang="en" href="https://www.arqingrenders.com/work/">
    <link rel="alternate" hreflang="es-MX" href="https://www.arqingrenders.com/es/proyectos/">
    <link rel="alternate" hreflang="x-default" href="https://www.arqingrenders.com/work/">
    <meta name="language" content="en-US">

    <!-- Social Preview -->
    <meta property="og:title" content="Architectural Visualization Portfolio | Arqing">
    <meta property="og:description" content="Explore Arqing's architectural visualization portfolio across stills, animations, and immersive 360° experiences for premium real estate and design presentations.">
    <meta property="og:url" content="https://www.arqingrenders.com/work/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.arqingrenders.com/assets/resources/og_images/og_image_qeur.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Work | Arqing">
    <meta name="twitter:description" content="Explore Arqing's architectural visualization portfolio across stills, animations, and immersive 360° experiences for premium real estate and design presentations.">
    <meta name="twitter:image" content="https://www.arqingrenders.com/assets/resources/og_images/og_image_qeur.jpg">

    <script>
        if (window.location.hash === '#all-work') {
            let shouldSkipWorkIntro = false;

            try {
                shouldSkipWorkIntro = sessionStorage.getItem('arq-work-return-all-work') === '1';
                if (shouldSkipWorkIntro) {
                    sessionStorage.removeItem('arq-work-return-all-work');
                    window.__ARQ_SKIP_WORK_INTRO__ = true;
                }
            } catch (error) {
            }

            try {
                history.scrollRestoration = 'manual';
            } catch (error) {
            }

            window.scrollTo(0, 0);
        }
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/resources/favicon/Favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/resources/favicon/Favicon_16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/resources/favicon/Favicon_apple-touch-icon.png">

    <!-- CSS CORE -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/utilities.css">

    <!-- CSS COMPONENTS -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">

    <!-- CSS PAGES -->
    <link rel="stylesheet" href="/css/work.css">
</head>

<body>

    <div id="header" data-lang-en="/work/" data-lang-es="/es/proyectos/"></div>

    <main id="main">

        <!-- SECTION 1: WORK HEADER -->
        <section class="work-header" data-js-reveal>
            <h1 class="work-title">work</h1>
            <h2 class="work-subtitle">
                <span class="work-subtitle-line-1">Are you just building walls...</span>
                <span class="work-subtitle-line-2">Or crafting a Lifestyle?</span>
            </h2>
        </section>

        <!-- SECTION 2: PORTFOLIO GALLERY (Combined Horizontal & Vertical) -->
        <section class="section-work combined-gallery" style="padding-top: 0;">
            <div class="gallery-container">
                <div class="large-images">

                    <!-- HORIZONTAL GALLERY (4 images) -->
                    <p class="work-selected-kicker">Selected work</p>
                    <h2 class="work-mobile-zone-title">INTERIORS</h2>
                    <div class="horizontal-scroll-container">
                        <div class="horizontal-scroll-content">
                            <div class="large-image horizon horizon-card" id="img-0">
                                <img class="horizon-img" src="/assets/img/work/Tulum-bedroom.avif" alt="Tulum Bedroom" width="2000" height="1334">
                            </div>
                            <div class="large-image horizon horizon-card" id="img-1">
                                <img class="horizon-img" src="/assets/img/work/NJ_GF_LOUNGE_2.avif" alt="NJ GF Lounge" loading="lazy" decoding="async" width="2000" height="2000">
                            </div>
                            <div class="large-image horizon horizon-card" id="img-2">
                                <img class="horizon-img" src="/assets/img/work/CPR-Bedroom.avif" alt="CPR Bedroom" loading="lazy" decoding="async" width="1920" height="1423">
                            </div>
                            <div class="large-image horizon horizon-card" id="img-3">
                                <img class="horizon-img" src="/assets/img/work/LIC_small.avif" alt="38-42 12 St" loading="lazy" decoding="async" width="2528" height="1696">
                            </div>
                        </div>
                    </div>

                    <!-- VERTICAL STACKED CARDS (4 images) -->
                    <h2 class="work-mobile-zone-title">EXTERIORS</h2>
                    <div class="vertical-scroll-container">
                        <div class="large-image vertical" id="img-4">
                            <img class="vertical-img" src="/assets/img/work/429-W-37th.avif" alt="429 W 37th" loading="lazy" decoding="async" width="1200" height="1500">
                        </div>
                        <div class="large-image vertical" id="img-5">
                            <img class="vertical-img" src="/assets/img/work/83 Wythe.avif" alt="83 Wythe" loading="lazy" decoding="async" width="2500" height="2500">
                        </div>
                        <div class="large-image vertical" id="img-6">
                            <img class="vertical-img" src="/assets/img/work/Caesars Palace.avif" alt="Caesars Palace" loading="lazy" decoding="async" width="2000" height="1333">
                        </div>
                        <div class="large-image vertical" id="img-7">
                            <img class="vertical-img" src="/assets/img/work/Tulum-1_.avif" alt="Tulum" loading="lazy" decoding="async" width="1920" height="1476">
                        </div>
                    </div>

                    <!-- AERIAL VIEWS (STACKED SCROLL) -->
                    <h2 class="work-mobile-zone-title">AERIALS</h2>
                    <div class="stacked-scroll-trigger">
                        <div class="stacked-scroll-cards">
                            <div class="large-image stacked stacked-card" id="img-8">
                                <img class="stacked-img" src="/assets/img/work/Caesars Palace-Aerial.avif" loading="lazy" decoding="async"
                                    alt="Caesars Palace Aerial" width="1920" height="1091">
                            </div>
                            <div class="large-image stacked stacked-card" id="img-9">
                                <img class="stacked-img" src="/assets/img/work/34-49 Steinway St-Aerial.avif" loading="lazy" decoding="async"
                                    alt="34-49 Steinway St Aerial" width="2295" height="1836">
                            </div>
                            <div class="large-image stacked stacked-card" id="img-10">
                                <img class="stacked-img" src="/assets/img/work/Williamsburg.avif" alt="Williamsburg" loading="lazy" decoding="async" width="1500" height="745">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="minimap">
                    <!-- Horizontal thumbs -->
                    <div class="thumb" data-target="0">
                        <img src="/assets/img/work/Tulum-bedroom.avif" alt="Tulum Bedroom" loading="lazy" decoding="async" width="2000" height="1334">
                    </div>
                    <div class="thumb" data-target="1">
                        <img src="/assets/img/work/NJ_GF_LOUNGE_2.avif" alt="NJ GF Lounge" loading="lazy" decoding="async" width="2000" height="2000">
                    </div>
                    <div class="thumb" data-target="2">
                        <img src="/assets/img/work/CPR-Bedroom.avif" alt="CPR Bedroom" loading="lazy" decoding="async" width="1920" height="1423">
                    </div>
                    <div class="thumb" data-target="3">
                        <img src="/assets/img/work/LIC_small.avif" alt="38-42 12 St" loading="lazy" decoding="async" width="2528" height="1696">
                    </div>

                    <!-- Vertical thumbs -->
                    <div class="thumb" data-target="4">
                        <img src="/assets/img/work/429-W-37th.avif" alt="429 W 37th" loading="lazy" decoding="async" width="1200" height="1500">
                    </div>
                    <div class="thumb" data-target="5">
                        <img src="/assets/img/work/83 Wythe.avif" alt="83 Wythe" loading="lazy" decoding="async" width="2500" height="2500">
                    </div>
                    <div class="thumb" data-target="6">
                        <img src="/assets/img/work/Caesars Palace.avif" alt="Caesars Palace" loading="lazy" decoding="async" width="2000" height="1333">
                    </div>
                    <div class="thumb" data-target="7">
                        <img src="/assets/img/work/Tulum-1_.avif" alt="Tulum" loading="lazy" decoding="async" width="1920" height="1476">
                    </div>

                    <!-- Stacked thumbs -->
                    <div class="thumb" data-target="8">
                        <img src="/assets/img/work/Caesars Palace-Aerial.avif" alt="Caesars Palace Aerial" loading="lazy" decoding="async" width="1920" height="1091">
                    </div>
                    <div class="thumb" data-target="9">
                        <img src="/assets/img/work/34-49 Steinway St-Aerial.avif" alt="34-49 Steinway St Aerial" loading="lazy" decoding="async" width="2295" height="1836">
                    </div>
                    <div class="thumb" data-target="10">
                        <img src="/assets/img/work/Williamsburg.avif" alt="Williamsburg" loading="lazy" decoding="async" width="1500" height="745">
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 3: WORK GRID -->
        <section class="section-work" id="all-work">
            <h2 class="all-work-title">All Work</h2>
            <div class="work-grid">
                <!-- Stills -->
                <a href="/work/stills/" class="work-item">
                    <div class="work-mask">
                        <img src="/assets/img/work/Chachalacas.avif" alt="Architectural visualization portfolio preview" class="work-img" loading="lazy" decoding="async" width="2752" height="1536">
                    </div>
                    <div class="work-info">
                        <span>Imagery</span>
                        <h3>Stills</h3>
                    </div>
                </a>

                <!-- Animations -->
                <a href="/work/animations/" class="work-item alt">
                    <div class="work-mask" style="aspect-ratio: 21 / 9;">
                        <video class="work-img"
                               autoplay loop muted playsinline
                               preload="none"
                               poster="/assets/vid/vid_queensblvd_poster.avif"
                               aria-hidden="true"
                               disablepictureinpicture
                               disableremoteplayback>
                            <source src="/assets/vid/vid_queensblvd.webm" type="video/webm">
                            <source src="/assets/vid/vid_queensblvd.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="work-info">
                        <span>Motion</span>
                        <h3>Animations</h3>
                    </div>
                </a>

                <!-- 360 Tours -->
                <a href="/work/360/" class="work-item">
                    <div class="work-mask">
                        <video class="work-img"
                               autoplay loop muted playsinline
                               preload="none"
                               poster="/assets/vid/vid_360_poster.avif"
                               aria-hidden="true"
                               disablepictureinpicture
                               disableremoteplayback>
                            <source src="/assets/vid/vid_360.webm" type="video/webm">
                            <source src="/assets/vid/vid_360.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="work-info">
                        <span>Immersive</span>
                        <h3>360 Tours</h3>
                    </div>
                </a>
            </div>
        </section>

    </main>

    <div id="footer"></div>

    <!-- JS -->
    <!-- 1. GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- 2. Local Logic -->
    <script defer src="/js/load-components.js"></script>
    <script defer src="/js/burger.js"></script>
    <script defer src="/js/video-visibility.js"></script>
    <script type="module" src="/js/work.js"></script>
    <script defer src="/js/boot-ready.js"></script>
</body>

</html>
